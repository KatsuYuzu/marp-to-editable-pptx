name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Generate DOM walker script
        run: node src/native-pptx/scripts/generate-dom-walker-script.js

      - name: Build native PPTX bundle
        run: node src/native-pptx/scripts/build-native-pptx-bundle.js

      - name: Type check
        run: npm run compile

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generate full structural fixture
        run: |
          node src/native-pptx/scripts/generate-fixture-manifest.js
          npx @marp-team/marp-cli \
            src/native-pptx/test-fixtures/pptx-export.md \
            -o /tmp/slides-ci.html \
            --allow-local-files \
            --html
          npx @marp-team/marp-cli \
            src/native-pptx/test-fixtures/pptx-export.md \
            -o /tmp/slides-bespoke-ci.html \
            --allow-local-files \
            --html \
            --template bespoke
          node src/native-pptx/tools/gen-pptx.js \
            /tmp/slides-ci.html \
            /tmp/slides-ci.pptx
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          MARP_PPTX_DEBUG: '1'

      - name: Validate browser and PPTX text contracts
        run: |
          npx jest \
            src/native-pptx/extraction-contract.test.ts \
            src/native-pptx/pptx-contract.test.ts \
            src/native-pptx/active-slide-contract.test.ts \
            src/native-pptx/fixture-contract.test.ts \
            --runInBand
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          MARP_STRUCTURAL_HTML: /tmp/slides-ci.html
          MARP_BESPOKE_HTML: /tmp/slides-bespoke-ci.html
          MARP_STRUCTURAL_DATA: /tmp/slides-ci.json
          MARP_PPTX_PATH: /tmp/slides-ci.pptx
